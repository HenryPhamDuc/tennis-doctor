<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <defs>
        <radialGradient id="ballGrad" cx="35%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#e6f06b"/>
            <stop offset="60%" stop-color="#cddc39"/>
            <stop offset="100%" stop-color="#9e9d24"/>
        </radialGradient>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2e7d32"/>
            <stop offset="100%" stop-color="#1b5e20"/>
        </linearGradient>
    </defs>
    <!-- Court green background -->
    <circle cx="50" cy="50" r="48" fill="url(#bg)" stroke="#1b5e20" stroke-width="2"/>
    <!-- Tennis ball -->
    <circle cx="50" cy="50" r="28" fill="url(#ballGrad)" stroke="#827717" stroke-width="1.5"/>
    <!-- Ball seam curves -->
    <path d="M 26 42 Q 50 50 74 42" fill="none" stroke="#827717" stroke-width="1.5" opacity="0.7"/>
    <path d="M 26 58 Q 50 50 74 58" fill="none" stroke="#827717" stroke-width="1.5" opacity="0.7"/>
    <path d="M 50 22 Q 38 50 50 78" fill="none" stroke="#827717" stroke-width="1.5" opacity="0.7"/>
    <!-- Highlight on ball -->
    <ellipse cx="40" cy="40" rx="8" ry="5" fill="#fff" opacity="0.4"/>
    <!-- Stethoscope element (doctor theme) -->
    <path d="M 30 70 Q 30 78 38 78 Q 46 78 46 70" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
    <circle cx="38" cy="78" r="3" fill="#fff" opacity="0.9"/>
</svg>